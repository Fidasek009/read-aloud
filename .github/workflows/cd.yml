name: CD

# Both callers run CI first. Manual Store check always requests dry-run.
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false
      store:
        type: string
        default: all
      recovery-tag:
        type: string
        default: ""
      recovery-run-id:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  preflight:
    if: inputs.recovery-tag == ''
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    environment: stores
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ inputs.dry-run }}
      STORE: ${{ inputs.store }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
      CHROME_SERVICE_ACCOUNT_EMAIL: ${{ vars.CHROME_SERVICE_ACCOUNT_EMAIL }}
      CHROME_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - name: Check requested store configuration
        shell: bash
        run: |
          case "$STORE" in chrome|firefox|all) ;; *) echo 'Unknown store'; exit 1 ;; esac
          if test "$DRY_RUN" = true; then
            test "$GITHUB_REF_TYPE" = branch
            test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          else
            test "$GITHUB_REF_TYPE" = tag
            test "$STORE" = all
          fi
          keys=()
          if test "$STORE" != firefox; then
            keys+=(CHROME_EXTENSION_ID CHROME_PUBLISHER_ID CHROME_SERVICE_ACCOUNT_EMAIL CHROME_WORKLOAD_IDENTITY_PROVIDER)
          fi
          if test "$STORE" != chrome; then
            keys+=(FIREFOX_EXTENSION_ID FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET)
            test "$FIREFOX_EXTENSION_ID" != 'read-aloud@local.invalid'
          fi
          for key in "${keys[@]}"; do
            test -n "${!key}" || { echo "Missing publishing configuration: $key"; exit 1; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: extension-*
          merge-multiple: true
          path: .output
      - name: Obtain short-lived Chrome publishing token
        if: inputs.store == 'all' || inputs.store == 'chrome'
        id: chrome-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Authenticate Chrome without uploading
        if: inputs.store == 'all' || inputs.store == 'chrome'
        env:
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.chrome-auth.outputs.access_token }}
        run: bun scripts/publish-extension.ts chrome --dry-run
      - name: Authenticate Firefox without uploading
        if: inputs.store == 'all' || inputs.store == 'firefox'
        run: bun scripts/publish-extension.ts firefox --dry-run

  publish:
    name: Publish (${{ matrix.browser }})
    if: ${{ !inputs.dry-run && inputs.recovery-tag == '' }}
    needs: preflight
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      id-token: write
    environment: stores
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-${{ matrix.browser }}
          path: .output
      - name: Obtain short-lived Chrome publishing token
        if: matrix.browser == 'chrome'
        id: chrome-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Submit Chrome for review and automatic publication
        if: matrix.browser == 'chrome'
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.chrome-auth.outputs.access_token }}
        run: bun scripts/publish-extension.ts chrome --publish
      - name: Create or update Firefox listing and submit reviewer sources
        if: matrix.browser == 'firefox'
        run: bun scripts/publish-extension.ts firefox --publish
        env:
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

  recover:
    if: inputs.recovery-tag != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    environment: stores
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.recovery-tag }}
      RELEASE_RUN_ID: ${{ inputs.recovery-run-id }}
      STORE: ${{ inputs.store }}
    steps:
      - name: Restrict recovery to manual dispatch on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF_TYPE" = branch
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          case "$STORE" in firefox|all) ;; *) exit 1 ;; esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - name: Verify original CI run and immutable tag
        run: bun scripts/check-release-recovery.ts
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.recovery-tag }}
          path: release-input
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.recovery-run-id }}
          name: extension-firefox
          path: release-input/.output
      - name: Obtain short-lived Chrome status token
        if: inputs.store == 'all'
        id: chrome-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.CHROME_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.CHROME_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/chromewebstore
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false
      - name: Repair accepted Firefox metadata and verify existing Chrome submission
        run: bun scripts/recover-store-release.ts
        env:
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_ACCESS_TOKEN: ${{ steps.chrome-auth.outputs.access_token }}
