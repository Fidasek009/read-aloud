name: CD

# Both callers run CI first. Manual Store check always requests dry-run.
on:
  workflow_call:
    inputs:
      dry-run:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-26.04
    environment: stores
    timeout-minutes: 10
    env:
      DRY_RUN: ${{ inputs.dry-run }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
      CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
      FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
      CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
      CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
      FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
      FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
    steps:
      - name: Check both stores before any upload
        shell: bash
        run: |
          if test "$DRY_RUN" = true; then
            test "$GITHUB_REF_TYPE" = branch
            test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          else
            test "$GITHUB_REF_TYPE" = tag
          fi
          for key in CHROME_EXTENSION_ID CHROME_PUBLISHER_ID FIREFOX_EXTENSION_ID CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL CHROME_SERVICE_ACCOUNT_PRIVATE_KEY FIREFOX_JWT_ISSUER FIREFOX_JWT_SECRET; do
            test -n "${!key}" || { echo "Missing publishing configuration: $key"; exit 1; }
          done
          test "$FIREFOX_EXTENSION_ID" != 'read-aloud@local.invalid'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: extension-*
          merge-multiple: true
          path: .output
      - name: Authenticate both stores without uploading
        run: |
          bun scripts/publish-extension.ts chrome --dry-run
          bun scripts/publish-extension.ts firefox --dry-run

  publish:
    name: Publish (${{ matrix.browser }})
    if: ${{ !inputs.dry-run }}
    needs: preflight
    runs-on: ubuntu-26.04
    environment: stores
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: extension-${{ matrix.browser }}
          path: .output
      - name: Submit Chrome for review and automatic publication
        if: matrix.browser == 'chrome'
        env:
          CHROME_EXTENSION_ID: ${{ vars.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ vars.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
        run: bun scripts/publish-extension.ts chrome --publish
      - name: Submit Firefox and reviewer sources
        if: matrix.browser == 'firefox'
        run: bun scripts/publish-extension.ts firefox --publish
        env:
          FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
