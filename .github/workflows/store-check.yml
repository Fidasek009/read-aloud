name: Store check

# Credential validation only: no tag, upload, submission or GitHub release.
on:
  workflow_dispatch:
    inputs:
      store:
        description: Store to authenticate without uploading
        type: choice
        options: [chrome, firefox, all]
        default: chrome
        required: true

permissions:
  contents: read

jobs:
  ci:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    uses: ./.github/workflows/ci.yml

  dry-run:
    needs: ci
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      dry-run: true
      store: ${{ inputs.store }}
    secrets: inherit
