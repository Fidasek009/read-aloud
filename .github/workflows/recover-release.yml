name: Recover release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (never moved or rebuilt)
        required: true
        type: string
      run-id:
        description: Original Release workflow run ID with successful CI
        required: true
        type: string
      store:
        description: Repair Firefox only, or verify both stores and publish GitHub release
        type: choice
        options: [firefox, all]
        default: firefox
        required: true

permissions:
  contents: read

concurrency:
  group: store-release
  cancel-in-progress: false

jobs:
  recover:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cd.yml
    with:
      store: ${{ inputs.store }}
      recovery-tag: ${{ inputs.tag }}
      recovery-run-id: ${{ inputs.run-id }}
    secrets: inherit

  release:
    name: Publish recovered GitHub release
    needs: recover
    if: inputs.store == 'all'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run-id }}
          pattern: extension-*
          merge-multiple: true
          path: artifacts
      - name: Publish the original tested packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: bun scripts/github-release.ts
