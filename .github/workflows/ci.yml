name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-version.ts
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test
      - run: bun run lint:workflows

  package:
    name: Package (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: matrix.browser == 'chrome'
        run: bun run zip
      - if: matrix.browser == 'firefox'
        run: bun run zip:firefox
      - name: Validate packaged manifest
        env:
          TARGET_BROWSER: ${{ matrix.browser }}
        run: bun scripts/check-package.ts
      - name: Rebuild reviewer sources and compare every packaged file
        if: matrix.browser == 'firefox'
        run: bun run check:source-rebuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-${{ matrix.browser }}
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 14

  complete:
    name: CI complete
    if: always()
    needs: [checks, package]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGE: ${{ needs.package.result }}
        run: test "$CHECKS" = success && test "$PACKAGE" = success
