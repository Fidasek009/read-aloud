name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun scripts/release-version.ts
      - name: Check licensing review fingerprints (public release may remain blocked)
        run: bun run check:licenses
      - run: bun run typecheck
      - run: bun run format:check
      - run: bun run test
      - name: Validate Firefox listing and license metadata
        run: bun scripts/firefox-metadata.ts
      - run: bun run lint:workflows

  package:
    name: Package (${{ matrix.browser }})
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    env:
      FIREFOX_EXTENSION_ID: ${{ vars.FIREFOX_EXTENSION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - if: matrix.browser == 'chrome'
        run: bun run zip
      - if: matrix.browser == 'firefox'
        run: bun run zip:firefox
      - name: Validate packaged manifest
        env:
          TARGET_BROWSER: ${{ matrix.browser }}
        run: bun scripts/check-package.ts
      - name: Rebuild reviewer sources and compare every packaged file
        if: matrix.browser == 'firefox'
        run: bun run check:source-rebuild
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-${{ matrix.browser }}
          path: .output/*.zip
          # WXT writes archives into a dot-directory; only these ZIPs are uploaded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  store-assets:
    name: Store assets
    needs: checks
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun run package:store
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: extension-store-assets
          path: .output/*-store-assets.zip
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  complete:
    name: CI complete
    if: always()
    needs: [checks, package, store-assets]
    runs-on: ubuntu-26.04
    timeout-minutes: 1
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          PACKAGE: ${{ needs.package.result }}
          STORE_ASSETS: ${{ needs.store-assets.result }}
        run: test "$CHECKS" = success && test "$PACKAGE" = success && test "$STORE_ASSETS" = success
