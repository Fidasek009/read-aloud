<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>PDF · Read Aloud</title>
	</head>
	<body>
		<header>
			<p id="status" role="status" aria-live="polite">Opening PDF…</p>
			<div id="controls"></div>
		</header>
		<main id="pages" aria-label="PDF document"></main>
		<div id="zoom" role="group" aria-label="Zoom" hidden>
			<button type="button" id="zoom-out" aria-label="Zoom out" title="Zoom out">−</button>
			<button type="button" id="zoom-reset" title="Reset zoom to fit width">
				<span class="visually-hidden">Reset zoom to fit width: </span><span id="zoom-level">100%</span>
			</button>
			<button type="button" id="zoom-in" aria-label="Zoom in" title="Zoom in">+</button>
		</div>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
