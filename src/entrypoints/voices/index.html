<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="referrer" content="no-referrer" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Voices · Read Aloud</title>
	</head>
	<body>
		<main>
			<h1>Choose your voice</h1>
			<p>Listen to a sample, then download the voices you want. Reading stays on your device.</p>
			<div class="filters" role="search" aria-label="Filter voices">
				<label for="search"
					>Search
					<input id="search" type="search" placeholder="Voice name or language" autocomplete="off" />
				</label>
				<label for="language"
					>Language
					<select id="language">
						<option value="">All languages</option>
					</select>
				</label>
				<label for="quality"
					>Quality
					<select id="quality">
						<option value="">All qualities</option>
					</select>
				</label>
			</div>
			<p id="count"></p>
			<p id="status" role="status" aria-live="polite"></p>
			<div id="voices" role="region" aria-label="Voice models" aria-describedby="count"></div>
			<footer>
				Samples stream when you press Listen. Each model has its own license.
				<a href="notices.html" target="_blank" rel="noopener">Licenses and sources</a>
			</footer>
		</main>
		<script type="module" src="./main.ts"></script>
	</body>
</html>
